[project]
name = "torch-optimi"
authors = [{ name = "Benjamin Warner", email = "me@benjaminwarner.dev" }]
description = "Fast, Modern, & Low Precision PyTorch Optimizers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["Optimizers", "PyTorch", "Deep Learning", "AI"]
version = "0.3.4"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2"]

[dependency-groups]
cpu = ["torch>=2.2"]
cu121 = ["torch>=2.2,<2.6"]
cu124 = ["torch>=2.4,<2.7"]
cu126 = ["torch>=2.6,<2.15"]
cu128 = ["torch>=2.7,<2.12"]
cu129 = ["torch>=2.8,<2.14"]
cu130 = ["torch>=2.9,<2.15"]
cu132 = ["torch>=2.12"]
cu134 = ["torch>=2.15"]
rocm = ["torch>=2.11,<2.15", "triton-rocm"]
rocm63 = ["torch>=2.7,<2.10", "pytorch-triton-rocm"]
rocm714 = ["torch>=2.14", "triton-rocm"]
rocm100 = ["torch>=2.15", "triton-rocm"]
xpu = ["torch>=2.10", "triton-xpu"]

test = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.10",
    "pytest-md>=0.2.0",
    "numpy>=1.23.0",
]
docs = [
    "mkdocs-material>=9.7.1",
    "mkdocstrings>=1.0.0",
    "mkdocstrings-python>=2.0.1",
    "black>=25.12.0",
    "mkdocs-caption>=1.3.0",
]
dev = [{ include-group = "test" }, { include-group = "docs" }]
bench = [
    "accelerate>=1.12.0",
    "torch>=2.7.0",
    "transformers>=4.57.3",
    "typer>=0.21.0",
]
all = [{ include-group = "dev" }, { include-group = "bench" }]

[project.urls]
"Homepage" = "https://optimi.benjaminwarner.dev"
"Bug Reports" = "https://github.com/warner-benjamin/optimi/issues"
"Source" = "https://github.com/warner-benjamin/optimi"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "optimi"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cpu",
    "gpu",
    "adam",
    "adan",
    "lion",
    "radam",
    "ranger",
    "sgd",
    "stableadam",
]
filterwarnings = [
    "ignore:Parameter `foreach` is deprecated:DeprecationWarning",
    "ignore:LaProp does not accept foreach; ignoring BaseParams.foreach=True\\.:RuntimeWarning",
]

[tool.ruff]
line-length = 140
extend-exclude = ["tests", "docs"]
src = ["optimi"]

[tool.ruff.format]
exclude = ["tests/reference", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "UP", "W291"]
extend-ignore = ["D100", "D105", "D107", "D206", "D300", "E111", "E114", "E117"]
pycodestyle.max-doc-length = 100
pydocstyle.convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["D104", "F401", "I002"]
"utils.py" = ["I002"]

[tool.uv]
# Prefer PyPI for shared dependencies and fall back to AMD for the ROCm SDK.
index-strategy = "unsafe-first-match"
# Resolve Python 3.11+ first to prefer newer wheels while keeping Python 3.10 support.
environments = ["python_version >= '3.11'", "python_version < '3.11'"]
conflicts = [
  [
    { group = "cpu" },
    { group = "cu121" },
    { group = "cu124" },
    { group = "cu126" },
    { group = "cu128" },
    { group = "cu129" },
    { group = "cu130" },
    { group = "cu132" },
    { group = "cu134" },
    { group = "rocm" },
    { group = "rocm63" },
    { group = "rocm714" },
    { group = "rocm100" },
    { group = "xpu" },
  ],
  [
    { group = "cu121" },
    { group = "cu124" },
    { group = "bench" },
    { group = "all" },
  ],
]

[tool.uv.dependency-groups]
cu134 = { requires-python = ">=3.11" }
rocm100 = { requires-python = ">=3.11" }

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu121", group = "cu121" },
  { index = "pytorch-cu124", group = "cu124" },
  { index = "pytorch-cu126", group = "cu126" },
  { index = "pytorch-cu128", group = "cu128" },
  { index = "pytorch-cu129", group = "cu129" },
  { index = "pytorch-cu130", group = "cu130" },
  { index = "pytorch-cu132", group = "cu132" },
  { index = "pytorch-cu134", group = "cu134", marker = "python_version >= '3.11'" },
  { index = "pytorch-rocm72", group = "rocm" },
  { index = "pytorch-rocm63", group = "rocm63" },
  { index = "pytorch-rocm714", group = "rocm714" },
  { index = "pytorch-rocm100", group = "rocm100", marker = "python_version >= '3.11'" },
  { index = "pytorch-xpu", group = "xpu" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm63", group = "rocm63" },
]
triton-rocm = [
  { index = "pytorch-rocm72", group = "rocm" },
  { index = "pytorch-rocm714", group = "rocm714" },
  { index = "pytorch-rocm100", group = "rocm100" },
]
triton-xpu = [
  { index = "pytorch-xpu", group = "xpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

